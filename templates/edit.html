<!DOCTYPE html>
<html>
<head>
    <title>Редактировать задачу</title>
    <style>
        body { 
            font-family: Arial; 
            margin: 40px; 
            background-color: #f0f0f0;
        }
        h1 { 
            color: #3366cc;
        }
        input, button { 
            padding: 8px; 
            margin: 5px; 
        }
        .error { 
            color: red; 
        }
        a {
            text-decoration: none;
            color: #3366cc;
        }
    </style>
</head>
<body>
    <h1>Редактирование задачи</h1>

    {% if message %}
        <p class="error">{{ message }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="task" value="{{ task.text }}">
        <button type="submit"> Сохранить</button>
        <a href="/"> Отмена</a>
    </form>
</body>
</html>
