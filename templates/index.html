<!DOCTYPE html>
<html>
<head>
    <title>Список дел</title>
    <style>
        body { 
            font-family: Arial; 
            margin: 40px; 
            background-color: #f0f0f0;
        }
        h1 { 
            color: #3366cc;
        }
        ul { list-style: none; padding: 0; }
        li { 
            margin: 10px 0; 
            padding: 10px;
            background-color: white;
            border-radius: 5px;
        }
        .task-date {
            font-size: 12px;
            color: #888;
            margin-left: 10px;
        }
        a {
            margin-left: 10px;
            text-decoration: none;
            color: #3366cc;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Мои задачи</h1>
    <p>📋 Осталось задач: {{ tasks | selectattr('done', 'equalto', False) | list | length }}</p>
    <ul>
    {% for task in tasks %}
    <li>
        {% if task.done %}
            <s>{{ task.text }}</s>
        {% else %}
            {{ task.text }}
        {% endif %}
        --- <small>{{ task.date }}</small>

        <a href="/toggle/{{ loop.index0 }}"> Выполнено</a>
        <a href="/edit/{{ loop.index0 }}"> Редактировать</a>
        <a href="/delete/{{ loop.index0 }}"> Удалить</a>
    </li>
    {% endfor %}
</ul>

    <h2>Добавить задачу</h2>
    <form method="POST" action="/add">
        <input type="text" name="task" placeholder="Новая задача" required>
        <button type="submit">Добавить</button>
    </form>

    <form action="/clear" method="POST">
        <button type="submit">Очистить всё</button>
    </form>
</body>
</html>
